<!--
  Cookie-Banner für Google-Ads-Conversion-Tracking (Datenschutzerklärung
  Abschnitt 5). Logik in assets/js/main.js (initCookieBanner), Wahl wird
  in localStorage unter "ads_consent" gespeichert.
-->
<div id="cookieBanner" class="cookie-banner" hidden>
  <div class="cookie-banner-inner container">
    <p>
      Diese Website verwendet ein Cookie zu Statistikzwecken. Weitere Informationen
      dazu sowie zu Ihren Wahlmöglichkeiten finden Sie in unserer
      <a href="/datenschutz.html#google-ads-tracking">Datenschutzerklärung</a>.
    </p>
    <div class="cookie-banner-actions">
      <button type="button" class="btn btn-outline" id="cookieDecline">Ablehnen</button>
      <button type="button" class="btn btn-accent" id="cookieAccept">Akzeptieren</button>
    </div>
  </div>
</div>
