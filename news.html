<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News – Förderverein Badminton in Eppstein e.V.</title>
  <meta name="description" content="Aktuelle Neuigkeiten der Badminton-Abteilung des TSV Eppstein.">
  <link rel="icon" href="https://tsv-eppstein-badminton.de/wp-content/uploads/2025/11/cropped-image-270x270.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <div id="site-header"></div>

  <main id="main">
    <section class="hero hero-simple">
      <div class="container">
        <h1>News</h1>
      </div>
    </section>

    <div class="container page-body">
      <div class="layout">
        <div>

          <div class="news-liste">
            {% for post in site.posts %}
            <div class="news-karte">
              <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
              <span class="datum">{{ post.date | date: "%d.%m.%Y" }}</span>
              <p>{{ post.excerpt }}</p>
            </div>
            {% endfor %}
          </div>


        </div>
        <div id="sidebar-trainingszeiten"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/main.js"></script>
</body>

</html>
