# Datenquelle für alle Galerie-Seiten (galerie-*.html).
#
# Struktur: pro Thema eine Liste von Jahren, pro Jahr eine Liste von Bildern.
# Bild-Dateien liegen unter: assets/img/gallery/<thema>/<jahr>/<datei>
#
# "alt" ist optional (Bildbeschreibung für Screenreader/SEO). Wenn du sie
# weglässt, wird automatisch ein generischer Text verwendet.
#
# Neues Jahr hinzufügen: einfach einen neuen "- jahr: ..."-Block ergänzen
# und die zugehörigen Bilder in einen neuen Ordner
# assets/img/gallery/<thema>/<jahr>/ hochladen. Kein HTML anfassen nötig.
#
# Dateinamen-Schema (von Kai so hochgeladen, dreistellig durchnummeriert):
# <thema>-<jahr>-<nummer>.webp, z. B. stadtmeisterschaft-2025-001.webp

