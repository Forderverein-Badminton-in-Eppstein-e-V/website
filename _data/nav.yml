# Zentrale Navigationsstruktur, genutzt von _includes/header.html.
#
# Ein Menüpunkt ändern/hinzufügen/entfernen = nur hier anpassen, header.html
# muss dafür nicht angefasst werden.
#
# Felder pro Eintrag:
#   label       - sichtbarer Text
#   url         - Linkziel. Innerhalb der Seite: root-relativer Pfad mit
#                 führendem Slash (z. B. "/index.html"), da die Seite an
#                 der Domain-Wurzel läuft.
#   submenu     - optional: Liste weiterer Einträge (Dropdown UND
#                 gleichzeitig Datenquelle für die Karten-Übersichten auf
#                 spielbetrieb.html/galerie.html - Duplikation vermeiden)
#   description - optional, nur auf Submenu-Ebene: Kurzbeschreibung für die
#                 Karten-Übersicht (wird im reinen Dropdown-Menü ignoriert)
#   data_key    - optional, nur auf Submenu-Ebene: Schlüssel in
#                 _data/gallery.yml, falls die Karten-Übersicht dynamische
#                 Werte (z. B. "Neueste Bilder: <Jahr>") anzeigen soll
#   button      - optional (true/false): als Button statt normalem Link
#                 darstellen (aktuell für "Mitgliedsantrag" genutzt)
#   external    - optional (true/false): öffnet in neuem Tab
#                 (target="_blank" rel="noopener")

