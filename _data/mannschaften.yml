# Datenquelle für die Mannschaften-Seite (spielbetrieb-mannschaften.html).
#
# Neue Mannschaft (z. B. nächste Saison) = neuen Block unten anhängen,
# kein HTML anfassen nötig. Vergiss nicht, site.verein.mannschaften_aktuell
# in _config.yml auf die neue Anzahl zu setzen.
#
# Felder pro Mannschaft:
#   name          - Pflicht, z. B. "1. Mannschaft"
#   liga          - Pflicht, z. B. "Bezirksoberliga Südwest"
#   tabelle_url   - Pflicht, Link zur Liga-Tabelle (liga.nu)
#   spielplan_url - Pflicht, Link zu den nächsten Spielen dieser Mannschaft
#   bild          - optional, Dateiname in assets/img/site/ (z. B. "team1.jpg").
#                   Weglassen/leer lassen, wenn noch kein Bild vorhanden ist -
#                   erscheint dann einfach nicht auf der Seite.
#   mannschaftsfuehrer - optional, Name. Weglassen, wenn noch nicht bekannt.
#   spieler       - optional, Liste von Namen. Weglassen/leere Liste, wenn
#                   noch nicht bekannt.

- name: "1. Mannschaft"
  liga: "Bezirksoberliga Südwest"
  bild: "team1.jpng"
  mannschaftsfuehrer: "Beatrice"
  spieler:
    - "Max Mustermann"
    - "Erika Musterfrau"
  tabelle_url: "https://bvrp-badminton.liga.nu/cgi-bin/WebObjects/nuLigaBADDE.woa/wa/groupPage?championship=VICTOR+BVRP+Ligen+26%2F27&group=41618"
