<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontakt – Förderverein Badminton in Eppstein e.V.</title>
    <meta name="description" content="Kontaktinformationen des Fördervereins Badminton in Eppstein e.V.">
    <link rel="icon" href="https://tsv-eppstein-badminton.de/wp-content/uploads/2025/11/cropped-image-270x270.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <div id="site-header"></div>

    <main id="main">
        <section class="hero hero-simple">
            <div class="container">
                <h1>Kontakt</h1>
            </div>
        </section>

        <div class="container page-body">
            <div class="layout">
                <div>

                    <!-- modify this form HTML and place wherever you want your form -->
                    <div data-fs-success>Thanks for your submission!</div>
                    <div data-fs-error>Oops! There was a problem submitting your form.</div>
                    <form id="my-form">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" data-fs-field />
                        <span data-fs-error="email"></span>
                        <label for="message">Message:</label>
                        <input type="text" id="message" name="message" data-fs-field />
                        <span data-fs-error="message"></span>
                        <button type="submit" data-fs-submit-btn>Submit</button>
                    </form>

                    <!-- Place these scripts at the end of the body tag -->
                    <script>
                        window.formspree =
                            window.formspree ||
                            function () {
                                (formspree.q = formspree.q || []).push(arguments);
                            };
                        formspree("initForm", {
                            formElement: "#my-form",
                            formId: "mwleoorw",
                        });
                    </script>
                    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

                </div>

                <div id="sidebar-trainingszeiten"></div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/main.js"></script>
</body>

</html>
