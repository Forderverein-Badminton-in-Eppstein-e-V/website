# Minimal-Konfiguration für Jekyll auf GitHub Pages.
# Kein Gemfile nötig - die hier gelisteten Plugins sind Teil der von
# GitHub Pages bereitgestellten "github-pages"-Gem-Sammlung und müssen
# nur hier aktiviert werden.

title: "TSV Eppstein Badminton"
description: "Badminton-Abteilung des TSV Eppstein in Frankenthal"

# Sprache der Seite - wird u.a. vom jekyll-seo-tag-Plugin für das
# og:locale-Meta-Tag genutzt (Standardwert des Plugins wäre sonst
# "en_US", auch wenn <html lang="de"> im Layout korrekt gesetzt ist -
# das eine hat mit dem anderen nichts zu tun).
lang: de
locale: de_DE

# Logo fürs Social-Media-Vorschaubild (Open Graph), ebenfalls vom
# jekyll-seo-tag-Plugin genutzt.
logo: "assets/img/site/logo.png"

# Für korrekte absolute URLs in der generierten sitemap.xml. Läuft die
# Seite an der Domain-Wurzel (eigene/custom Domain via CNAME-Datei), muss
# baseurl ein LEERER String sein - nicht "/". Nur bei einer GitHub
# Project Page mit Unterpfad (z. B. .../website/) wäre baseurl: "/website"
# korrekt.
url: "https://new.tsv-eppstein-badminton.de"
baseurl: ""

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Alle Seiten (auch News-Posts) nutzen überall relative Pfade ohne
# führenden Slash (siehe Abschnitt "Funktionsprinzip" im README). Das
# funktioniert nur, wenn jede Seite direkt im Root der Website liegt -
# Jekylls Standard-Permalink für Posts wäre aber verschachtelt
# (/YYYY/MM/DD/titel.html), was alle relativen Pfade auf so einer Seite
# brechen würde (CSS, Bilder, Navigation - alles). Deshalb hier auf eine
# flache Struktur umgestellt, passend zum Rest der Seite.
permalink: /:title.html

# Stellt sicher, dass jeder News-Post automatisch das post.html-Layout
# bekommt, auch wenn im jeweiligen Post selbst kein "layout:" gesetzt
# wird. Ohne das würde ein vergessenes layout: post dazu führen, dass die
# einzelne Post-Seite komplett unformatiert (ohne Header/Footer/CSS)
# ausgeliefert wird - ist uns schon passiert, deshalb dieser Schutz.
defaults:
  - scope:
      type: posts
    values:
      layout: post

# Globale Vereins-Kennzahlen, damit Zahlen wie Mitgliederzahl oder Anzahl
# Mannschaften nur an EINER Stelle gepflegt werden, auch wenn sie auf
# mehreren Seiten angezeigt werden (Startseite, Über uns, Mannschaften, ...).
# In Seiten per Liquid nutzen, z. B.: {{ site.verein.mitglieder_gesamt }}
#
# Wichtig: Änderungen hier wirken sich erst nach dem nächsten Build aus
# (auf GitHub Pages: nach dem nächsten Push/Upload - passiert automatisch).
verein:
  gegruendet: 1997
  mitglieder_gesamt: 70
  mitglieder_kinder: 20
  mitglieder_erwachsene: 50
  mannschaften_aktuell: 3
  saison_start_monat: "September"
  saison_aktuell: "2026/27"
  # Liga-Infos pro Mannschaft (früher hier als liga_erste_mannschaft etc.)
  # stehen jetzt strukturiert in _data/mannschaften.yml, zusammen mit
  # Tabellen-/Spielplan-Links pro Team.

# Dateien/Ordner, die Jekyll beim Build ignorieren soll (Dev-Kram, keine
# Website-Inhalte).
exclude:
  - README.md